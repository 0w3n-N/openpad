<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<link rel="icon" href="icon.svg">
<title>OpenPad · live notes</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="pad guest">
<header id="bar">
  <div class="group" id="tools">
    <button data-tool="pen" class="on" title="Pen (P)"><svg viewBox="0 0 24 24"><path d="M4 20l1.2-4.6L15.8 4.8a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8z"/><path d="M14 6.6l3.4 3.4"/></svg></button>
    <button data-tool="hl" title="Highlighter (H)"><svg viewBox="0 0 24 24"><path d="M9 15l-3 3v2h5l2-2"/><path d="M9 15l7.6-9.6a2 2 0 0 1 2.9-.2l.3.3a2 2 0 0 1-.2 2.9L10 16z"/><path d="M4 21h16" opacity=".5"/></svg></button>
    <button data-tool="eraser" title="Eraser: your own ink (E)"><svg viewBox="0 0 24 24"><path d="M8.5 20H20"/><path d="M4.6 15.4l9.8-9.8a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L11 19H8z"/><path d="M9.4 10.6l5 5"/></svg></button>
    <button data-tool="hand" title="Move around (space + drag)"><svg viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11.5V4a1.5 1.5 0 0 1 3 0v8M14 11.5V5.5a1.5 1.5 0 0 1 3 0V13M17 9.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-4.9-2.5L4.3 14a1.5 1.5 0 0 1 2.4-1.8L8 14"/></svg></button>
  </div>
  <div class="group" id="colors"></div>
  <div class="group" id="widths">
    <button data-w="2" title="Fine"><i class="w-s"></i></button>
    <button data-w="3.5" class="on" title="Medium"><i class="w-m"></i></button>
    <button data-w="6.5" title="Bold"><i class="w-l"></i></button>
  </div>
  <div class="group" id="undogroup">
    <button id="undo" title="Undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button id="redo" title="Redo"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  </div>
  <div class="spacer"></div>
  <div class="group" id="pager">
    <button id="prev" title="Previous page"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span id="pageno">–</span>
    <button id="next" title="Next page"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    <button id="followbtn" class="on" title="Follow the presenter's page">Follow</button>
  </div>
  <div class="group">
    <span id="dot" title="Connection"></span>
    <button id="savebtn" title="Save as PDF">Save PDF</button>
  </div>
</header>
<main id="stage"></main>
<button id="fitbtn" hidden>Fit page</button>

<dialog id="exportdlg">
  <form method="dialog">
    <h2>Save as PDF</h2>
    <label class="row"><span>This page</span><input type="radio" name="what" value="page" checked></label>
    <label class="row"><span>This section</span><input type="radio" name="what" value="section"></label>
    <label class="row"><span>All pages</span><input type="radio" name="what" value="all"></label>
    <p class="muted small" id="savehint">Your browser asks where to save it.</p>
    <div class="actions">
      <button class="btn" value="cancel">Cancel</button>
      <button class="btn primary" value="save">Save</button>
    </div>
  </form>
</dialog>
<div id="toast" hidden></div>
<script type="module" src="join.js"></script>
</body>
</html>
