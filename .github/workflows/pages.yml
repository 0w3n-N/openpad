name: pages

# Publishes the installable notes app (web/) to GitHub Pages:
# https://0w3n-n.github.io/openpad/ — the iPad caches it and works offline.
# Only the app's own files are published; the computer's share window, guest
# and setup pages are served by OpenPad itself.

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Collect the app's files
        run: |
          mkdir -p _site/node_modules/pdfjs-dist
          cp web/app.html _site/index.html
          mkdir -p _site/node_modules/jsqr
          cp web/app.html web/app.js web/editor.js web/ink.js web/link.js web/model.js web/scan.js web/store.js \
             web/ui.js web/style.css web/sw.js web/manifest.webmanifest web/icon.svg web/icon.png _site/
          cp web/node_modules/pdfjs-dist/pdf.min.mjs web/node_modules/pdfjs-dist/pdf.worker.min.mjs web/node_modules/pdfjs-dist/LICENSE _site/node_modules/pdfjs-dist/
          cp web/node_modules/jsqr/jsqr.js web/node_modules/jsqr/LICENSE _site/node_modules/jsqr/
          # A new cache version per deploy: the app updates all its files at once.
          sed -i "s/const VERSION = 'openpad-dev';/const VERSION = 'openpad-${GITHUB_SHA::12}';/" _site/sw.js
          grep -q "openpad-${GITHUB_SHA::12}" _site/sw.js
          # Every file the service worker caches must be published.
          for f in $(grep -oE "'[a-z0-9./_-]+\.(js|mjs|css|svg|png|html|webmanifest)'" _site/sw.js | tr -d "'"); do test -f "_site/$f"; done
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
