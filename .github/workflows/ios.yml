name: ios

# The native iPad app (ios/). Every push: test the shared core on Linux and
# macOS, build the app, run it in an iPad simulator against a real OpenPad
# server (checking it syncs and goes live), and keep screenshots plus an
# unsigned .ipa (for sideloading) as artifacts. "Run workflow" with the
# TestFlight box ticked also uploads a signed build (see ios/README.md).

on:
  push:
    paths: ["ios/**", "openpad/**", "web/model.js", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      testflight:
        description: "Upload a build to TestFlight (needs the App Store Connect secrets)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  XCODEGEN_URL: https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Merge rules match openpad/notebook.py
        working-directory: ios/OpenPadCore
        run: |
          swift --version
          swift test

  app:
    name: App (build, simulator, screenshots)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install XcodeGen (pinned, checksum verified)
        run: |
          curl -sSL -o "$RUNNER_TEMP/xcodegen.zip" "$XCODEGEN_URL"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate the Xcode project
        working-directory: ios
        run: |
          xcodebuild -version
          xcodegen generate
      - name: Pick an iPad simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          best = None
          for runtime, items in devs.items():
              if "iOS" not in runtime:
                  continue
              ver = tuple(int(x) for x in runtime.rsplit("iOS-", 1)[-1].split("-"))
              for d in items:
                  if "iPad" in d["name"] and (best is None or ver > best[0] or (ver == best[0] and "Pro" in d["name"])):
                      best = (ver, d["udid"], d["name"])
          print(best[1]); print(best[2], best[0], file=sys.stderr)
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - name: Build for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project OpenPad.xcodeproj -scheme OpenPad -configuration Debug -destination "id=$UDID" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|will be an error)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Run it against a real OpenPad server
        run: |
          set -e
          export XDG_DATA_HOME="$RUNNER_TEMP/opdata" XDG_RUNTIME_DIR="$RUNNER_TEMP/oprun" OPENPAD_NOTES="$RUNNER_TEMP/opnotes"
          mkdir -p "$XDG_RUNTIME_DIR" shots
          python3 -B bin/openpad serve --port 8770 --bind 127.0.0.1 --quiet > server.log 2>&1 &
          sleep 3
          KEY=$(cat "$XDG_DATA_HOME/openpad/token")
          API="http://127.0.0.1:8770"
          APP=io.github.0w3n-n.openpad
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/build/Build/Products/Debug-iphonesimulator/OpenPad.app
          DATA="$(xcrun simctl get_app_container "$UDID" "$APP" data)/Library/Application Support/OpenPad"

          echo "== 1. the library syncs to the computer, into its folder"
          xcrun simctl launch "$UDID" "$APP" -openpadDemo YES -openpadServer "$API" -openpadKey "$KEY"
          sleep 16
          xcrun simctl io "$UDID" screenshot shots/1-library.png
          DEMO=$(curl -s "$API/api/sync?k=$KEY" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(n["id"] for n in d["notebooks"] if n["title"] == "Demo notebook"))')
          test -f "$OPENPAD_NOTES/2025 Fall/ECE 210/Demo notebook/.openpad/notebook.json"
          xcrun simctl terminate "$UDID" "$APP"

          echo "== 2. live: the iPad's strokes reach the computer, guests' strokes reach the iPad"
          xcrun simctl launch "$UDID" "$APP" -openpadOpen YES -openpadDrawTest YES
          sleep 14
          xcrun simctl io "$UDID" screenshot shots/2-editor.png
          curl -s "$API/api/sync?k=$KEY" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["live"] == sys.argv[1], d["live"]' "$DEMO"
          curl -s "$API/api/sync/nb/$DEMO?k=$KEY" | grep -q cistroke01
          GUEST=$(curl -s "$API/api/info?k=$KEY" | python3 -c 'import json,sys; print(json.load(sys.stdin)["guests"]["w"].split("#w=")[1])')
          python3 ios/ci/guest_stroke.py 8770 "$GUEST" guestci1
          sleep 4
          xcrun simctl io "$UDID" screenshot shots/3-guest-stroke.png

          echo "== 3. the computer's Sync button"
          curl -s -X POST "$API/api/sync/request?k=$KEY"; echo
          for i in $(seq 1 60); do
            if curl -s "$API/api/info?k=$KEY" | python3 -c 'import json,sys; l=json.load(sys.stdin).get("lastSync") or {}; sys.exit(0 if l.get("ok") else 1)'; then break; fi
            sleep 1
          done
          curl -s "$API/api/info?k=$KEY" | python3 -c 'import json,sys; l=json.load(sys.stdin)["lastSync"]; print(l); assert l["ok"] and l["notebooks"] >= 1'
          grep -q guestci1 "$DATA/notebooks/$DEMO.json"
          find "$OPENPAD_NOTES" -name "*.pdf" | tee pdfs.txt
          test -f "$OPENPAD_NOTES/2025 Fall/ECE 210/Demo notebook/Kinematics.pdf"
          cp "$OPENPAD_NOTES/2025 Fall/ECE 210/Demo notebook/Kinematics.pdf" shots/4-kinematics.pdf
          xcrun simctl terminate "$UDID" "$APP"

          echo "== 4. offloading keeps the outline; opening downloads it again"
          xcrun simctl launch "$UDID" "$APP" -openpadOffloadAll YES
          sleep 15
          xcrun simctl io "$UDID" screenshot shots/5-offloaded.png
          python3 - "$DATA" "$DEMO" <<'PY'
          import json, sys
          data, demo = sys.argv[1], sys.argv[2]
          e = next(x for x in json.load(open(f"{data}/index.json")) if x["id"] == demo)
          nb = json.load(open(f"{data}/notebooks/{demo}.json"))
          print("offloaded:", e["offloaded"], "strokes:", sum(len(p["strokes"]) for p in nb["pages"].values()))
          assert e["offloaded"] and all(not p["strokes"] for p in nb["pages"].values())
          assert all(p.get("title") is not None for p in nb["pages"].values()) and nb["layout"]["sections"]
          PY
          xcrun simctl terminate "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$APP" -openpadOpen YES
          sleep 14
          xcrun simctl io "$UDID" screenshot shots/6-downloaded.png
          python3 - "$DATA" "$DEMO" <<'PY'
          import json, sys
          data, demo = sys.argv[1], sys.argv[2]
          e = next(x for x in json.load(open(f"{data}/index.json")) if x["id"] == demo)
          ink = open(f"{data}/notebooks/{demo}.json").read()
          print("offloaded:", e["offloaded"])
          assert not e["offloaded"] and "cistroke01" in ink and "guestci1" in ink
          PY
      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ipad-simulator
          path: |
            shots/
            server.log
            ios/build.log
          if-no-files-found: warn
      - name: Unsigned build for sideloading (AltStore, SideStore)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project OpenPad.xcodeproj -scheme OpenPad -configuration Release -destination generic/platform=iOS \
            -archivePath build/OpenPad.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log
          mkdir -p ipa/Payload
          cp -R build/OpenPad.xcarchive/Products/Applications/OpenPad.app ipa/Payload/
          (cd ipa && zip -qr ../OpenPad-unsigned.ipa Payload)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OpenPad-unsigned-ipa
          path: ios/OpenPad-unsigned.ipa

  testflight:
    name: TestFlight
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    needs: app
    runs-on: macos-15
    timeout-minutes: 45
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check the secrets are set
        run: |
          for v in KEY_ID ISSUER_ID KEY_P8 TEAM_ID; do
            if [ -z "${!v}" ]; then echo "Missing secret for $v (see ios/README.md)"; exit 1; fi
          done
      - name: Install XcodeGen (pinned, checksum verified)
        run: |
          curl -sSL -o "$RUNNER_TEMP/xcodegen.zip" "$XCODEGEN_URL"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Archive and upload (Xcode-managed signing with the API key)
        working-directory: ios
        run: |
          set -o pipefail
          xcodegen generate
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$KEY_P8" | base64 --decode > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          xcodebuild -project OpenPad.xcodeproj -scheme OpenPad -configuration Release -destination generic/platform=iOS \
            -archivePath build/OpenPad.xcarchive DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            "${AUTH[@]}" archive | tail -20
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/OpenPad.xcarchive -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export "${AUTH[@]}" | tail -20
          rm -f "$KEY_PATH"
