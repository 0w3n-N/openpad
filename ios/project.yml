# XcodeGen spec for the iPad app: `xcodegen generate` makes OpenPad.xcodeproj
# (not committed). CI does this; on a Mac: brew install xcodegen.
name: OpenPad
options:
  bundleIdPrefix: io.github.0w3n-n
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  OpenPadCore:
    path: OpenPadCore
targets:
  OpenPad:
    type: application
    platform: iOS
    sources:
      - path: OpenPad
    dependencies:
      - package: OpenPadCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.0w3n-n.openpad
        PRODUCT_NAME: OpenPad
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: NO
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: OpenPad/Info.plist
      properties:
        CFBundleDisplayName: OpenPad
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        NSCameraUsageDescription: OpenPad uses the camera to scan the QR code on your computer and connect to it.
        NSLocalNetworkUsageDescription: OpenPad syncs your notebooks with the computer you connect it to, and shows the open notebook there live.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: false
schemes:
  OpenPad:
    build:
      targets:
        OpenPad: all
    run:
      config: Debug
    archive:
      config: Release
